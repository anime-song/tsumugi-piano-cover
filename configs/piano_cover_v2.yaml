experiment_name: piano_cover_v2_tsumugi_diffusion
seed: 7

runtime:
  work_dir: runs/piano_cover_v2_tsumugi_diffusion
  autoencoder_work_dir: artifacts/piano_cover_v2_autoencoder
  autoencoder_checkpoint:
  num_workers: 4
  autoencoder_num_workers: 4
  autoencoder_max_cached_songs: 32
  log_every_steps: 20
  save_every_steps: 500

wandb:
  enabled: false
  project: piano-cover-v2
  entity:
  name:
  group:
  tags: []
  mode: online

dataset:
  dataset_json: data/metadata/dataset.json
  original_audio_dir: Dataset/original
  piano_midi_dir: Dataset/pianos_midi
  piano_audio_dir: Dataset/pianos
  piano_to_performer_json: data/metadata/piano_to_performer.json
  alignment_cache_dir: artifacts/piano_cover_v2_alignments
  train_fraction: 0.9
  val_fraction: 0.05
  test_fraction: 0.05

alignment:
  cache_dir:
  method: audio_sync
  frame_seconds: 0.1
  audio_sample_rate: 22050
  sync_feature_rate: 40
  sync_step_weights: [1.5, 1.5, 2.0]
  sync_threshold_rec: 1000000

target_roll:
  frame_seconds: 0.05
  phrase_seconds: 1.28
  phrase_hop_seconds: 0.64
  pitch_min: 21
  pitch_max: 108
  min_duration_seconds: 0.03
  # 768 * 0.65秒 = 499秒。データセット最長曲(463秒)まで打ち切られない
  max_phrases_per_song: 768
  onset_threshold: 0.5
  sustain_threshold: 0.5
  pedal_threshold: 0.5

autoencoder_model:
  d_model: 256
  latent_dim: 128
  num_latent_queries: 4
  encoder_layers: 4
  decoder_layers: 4
  num_heads: 4
  ff_multiplier: 4
  dropout: 0.1
  kl_beta: 0.001
  onset_positive_class_weight: 0.01
  onset_negative_class_weight: 0.99
  sustain_positive_class_weight: 0.05
  sustain_negative_class_weight: 0.95
  onset_loss_weight: 1.0
  sustain_loss_weight: 1.0
  pedal_loss_weight: 1.0
  velocity_loss_weight: 1.0

source_model:
  d_model: 256
  alignment_bias_strength: 1.0
  # 実測で |source_time - target_time| は中央値1.2秒/p75 6.5秒。sigma=2.0では
  # 推論時（alignmentなし=同時刻guide）にbiasが正解位置を外すため広めに取る
  alignment_bias_sigma_seconds: 6.0
  alignment_bias_aligned_time_weight: 1.0
  alignment_bias_dropout: 0.1
  alignment_bias_song_dropout: 0.1
  alignment_bias_identity_probability: 0.3

tsumugi_model:
  model_id: anime-song/tsumugi-mrl
  revision: 37e74399dcc60809b9f16bd0d837c8b99ed4719b
  hidden_dim: 512
  sample_rate: 22050
  audio_channels: 2
  lora_enabled: true
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.0
  lora_target_modules: [to_q, to_k, to_v]
  # VRAM 12GB では最長曲でも 3.9GB しか使わないため、再計算を省いて速度を取る
  gradient_checkpointing: false

diffusion_model:
  d_model: 256
  latent_dim: 128
  prediction_type: v
  num_layers: 6
  num_heads: 8
  ff_multiplier: 4
  dropout: 0.1
  performer_dropout: 0.1
  segment_time_min_period_seconds: 0.5
  segment_time_max_period_seconds: 1024.0
  num_train_timesteps: 1000
  beta_start: 1.0e-3
  beta_end: 0.02
  zero_terminal_snr: true
  sampling_steps: 50
  gradient_checkpointing: false

autoencoder_training:
  batch_size: 512
  grad_accum_steps: 8
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  max_epochs: 300
  max_steps:
  max_steps_per_epoch: 2000
  grad_clip_norm: 1.0
  mixed_precision: bf16
  lr_scheduler_type: cosine_with_warmup
  lr_warmup_steps: 1000
  lr_min: 1.0e-6
  pitch_shift_min_semitones: -5
  pitch_shift_max_semitones: 5
  # train_autoencoder.py はEMA/複数タイムステップ/生成チェックを使わない
  ema_enabled: false
  generation_eval_every_epochs: 0

diffusion_training:
  batch_size: 1
  grad_accum_steps: 4
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  max_epochs: 200
  max_steps:
  max_steps_per_epoch:
  grad_clip_norm: 1.0
  mixed_precision: bf16
  lr_scheduler_type: cosine_with_warmup
  lr_warmup_steps: 2000
  lr_min: 1.0e-6
  pitch_shift_min_semitones: 0
  pitch_shift_max_semitones: 0
  ema_enabled: true
  ema_decay: 0.999
  # 1曲あたり4つのタイムステップを引く。原曲エンコードを共有するので
  # コストは約2.3倍で済み、optimizer step あたりのタイムステップ数は 4 -> 16 になる
  timesteps_per_sample: 4
  val_timesteps: 5
  # 毎エポック実際に逆拡散を回して生成を確認する。4曲で約4秒、1エポック12.6分に対して0.5%
  generation_eval_every_epochs: 1
  generation_eval_songs: 4
  generation_eval_sampling_steps: 50
