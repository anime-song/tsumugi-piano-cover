experiment_name: piano_cover_v2_tsumugi_diffusion
seed: 7

runtime:
  work_dir: runs/piano_cover_v2_sigma05
  autoencoder_work_dir: artifacts/piano_cover_v2_autoencoder
  autoencoder_checkpoint:
  num_workers: 4
  autoencoder_num_workers: 4
  autoencoder_max_cached_songs: 32
  log_every_steps: 20
  save_every_steps: 500

wandb:
  enabled: false
  project: piano-cover-v2
  entity:
  name:
  group:
  tags: []
  mode: online

dataset:
  dataset_json: data/metadata/dataset.json
  original_audio_dir: Dataset/original
  piano_midi_dir: Dataset/pianos_midi
  piano_audio_dir: Dataset/pianos
  piano_to_performer_json: data/metadata/piano_to_performer.json
  alignment_cache_dir: artifacts/piano_cover_v2_alignments
  train_fraction: 0.9
  val_fraction: 0.05
  test_fraction: 0.05

alignment:
  cache_dir:
  method: audio_sync
  frame_seconds: 0.1
  audio_sample_rate: 22050
  sync_feature_rate: 40
  sync_step_weights: [1.5, 1.5, 2.0]
  sync_threshold_rec: 1000000

target_roll:
  frame_seconds: 0.05
  phrase_seconds: 1.28
  phrase_hop_seconds: 0.64
  pitch_min: 21
  pitch_max: 108
  min_duration_seconds: 0.03
  # 768 * 0.65秒 = 499秒。データセット最長曲(463秒)まで打ち切られない
  max_phrases_per_song: 768
  onset_threshold: 0.5
  sustain_threshold: 0.5
  pedal_threshold: 0.5

autoencoder_model:
  d_model: 256
  latent_dim: 128
  num_latent_queries: 4
  encoder_layers: 4
  decoder_layers: 4
  num_heads: 4
  ff_multiplier: 4
  dropout: 0.1
  kl_beta: 0.001
  onset_positive_class_weight: 0.01
  onset_negative_class_weight: 0.99
  sustain_positive_class_weight: 0.05
  sustain_negative_class_weight: 0.95
  onset_loss_weight: 1.0
  sustain_loss_weight: 1.0
  pedal_loss_weight: 1.0
  velocity_loss_weight: 1.0

source_model:
  d_model: 256
  alignment_bias_strength: 1.0
  # 潜在は発音時刻の位相に極めて敏感で、50ms ずらすだけで別カバー2本ぶんの
  # 距離の31%を消費する（diagnose_diffusion onset-sensitivity で実測）。
  # onset の一致も50ms精度を要求し、alignment 自体はその精度を渡せている
  # （カバー2本の一致度はずれ0に鋭いピーク、42%が完全一致）。
  # 一方 sigma=6.0 では bias が ±6秒を平均させており、注意エントロピー 6.31 が
  # bias 単体の理論値 6.43 と一致していた = 音符配置に必要な情報が届かない。
  # alignment 残差が最大±5フレーム(250ms)なので、2シグマで覆える 0.5 秒にする。
  alignment_bias_sigma_seconds: 0.5
  alignment_bias_aligned_time_weight: 1.0
  alignment_bias_dropout: 0.1
  alignment_bias_song_dropout: 0.1
  # alignment が無い曲では bias は 0 になる（song_dropout がその条件を学習済み）。
  # identity guide は「自曲の時刻に bias を張る」第三の人工条件で、sigma が
  # 狭いと正解位置を確実に外すため無効化する。
  alignment_bias_identity_probability: 0.0

tsumugi_model:
  model_id: anime-song/tsumugi-mrl
  revision: 37e74399dcc60809b9f16bd0d837c8b99ed4719b
  hidden_dim: 512
  sample_rate: 22050
  audio_channels: 2
  lora_enabled: true
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.0
  lora_target_modules: [to_q, to_k, to_v]
  # VRAM 12GB では最長曲でも 3.9GB しか使わないため、再計算を省いて速度を取る
  gradient_checkpointing: false

diffusion_model:
  d_model: 256
  latent_dim: 128
  prediction_type: v
  num_layers: 6
  num_heads: 8
  ff_multiplier: 4
  dropout: 0.1
  performer_dropout: 0.1
  segment_time_min_period_seconds: 0.5
  segment_time_max_period_seconds: 1024.0
  num_train_timesteps: 1000
  beta_start: 1.0e-3
  beta_end: 0.02
  zero_terminal_snr: true
  sampling_steps: 50
  gradient_checkpointing: false
  coarse_latent_enabled: true

autoencoder_training:
  batch_size: 512
  grad_accum_steps: 8
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  max_epochs: 300
  max_steps:
  max_steps_per_epoch: 2000
  grad_clip_norm: 1.0
  mixed_precision: bf16
  lr_scheduler_type: cosine_with_warmup
  lr_warmup_steps: 1000
  lr_min: 1.0e-6
  pitch_shift_min_semitones: -5
  pitch_shift_max_semitones: 5
  # train_autoencoder.py はEMA/複数タイムステップ/生成チェックを使わない
  ema_enabled: false
  generation_eval_every_epochs: 0

diffusion_training:
  batch_size: 1
  grad_accum_steps: 4
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  max_epochs: 200
  max_steps:
  max_steps_per_epoch:
  grad_clip_norm: 1.0
  mixed_precision: bf16
  lr_scheduler_type: cosine_with_warmup
  lr_warmup_steps: 2000
  lr_min: 1.0e-6
  pitch_shift_min_semitones: 0
  pitch_shift_max_semitones: 0
  ema_enabled: true
  ema_decay: 0.999
  # 1曲あたり4つのタイムステップを引く。原曲エンコードを共有するので
  # コストは約2.3倍で済み、optimizer step あたりのタイムステップ数は 4 -> 16 になる
  timesteps_per_sample: 4
  short_sequence_enabled: true
  # phrase 1.28s / hop 0.64s なので 45 セグメント = 44*0.64 + 1.28 = 29.44 秒
  short_sequence_segments: 45
  teacher_overlap_enabled: true
  # 先頭 9 セグメント = 8*0.64 + 1.28 = 6.4 秒を teacher overlap にする
  teacher_overlap_segments: 9
  val_timesteps: 5
  # 毎エポック実際に逆拡散を回して生成を確認する。4曲で約4秒、1エポック12.6分に対して0.5%
  generation_eval_every_epochs: 1
  generation_eval_songs: 4
  generation_eval_sampling_steps: 50
  on_policy:
    enabled: true
    replay_fraction: 0.25
    fresh_fraction: 0.25
    # 生成し直したロールアウトを何エポック使い回すか。1 = 毎エポック生成し直す。
    # 上げるほど学習は速くなるが、使う状態が古いポリシーのものになる。
    refresh_every_epochs: 3
    # ロールアウト1回あたりのコスト。refresh_every_epochs と合わせて速度が決まる
    sampling_steps: 20
    capture_timesteps: [591, 387, 183, 81]
    # 学習セット全体（2031曲）を覆う必要がある。下回ると前エポックの状態が
    # 再訪前に追い出され、replay 側が fresh 側の複製に退化する
    replay_max_songs: 4096
